# unbind C-b
# set -g prefix C-f
# bind C-f send-prefix

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"



set -g status-bg "#000000"
set -g status-fg "#999999"
set -g pane-active-border-style fg="#444444"
set -g pane-border-style fg="#00aaaa"
set -g window-status-current-style fg="#ffffff"

# set -g base-index 1
set -g renumber-windows on
set -g mouse on

set -g status-left "#H "
set -g status-right "#S "
set -g status-left-length 30

bind | split-window -h
bind - split-window -v



bind-key -r -T prefix       S-Up              resize-pane -U 5
bind-key -r -T prefix       S-Down            resize-pane -D 5
bind-key -r -T prefix       S-Left            resize-pane -L 5
bind-key -r -T prefix       S-Right           resize-pane -R 5




# set -g status-position top
