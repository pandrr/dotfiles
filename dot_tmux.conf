unbind C-b
set -g prefix C-space
bind C-space send-prefix

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"


set -g status-bg "#000000"
set -g status-fg "#999999"
set -g pane-active-border-style fg="#00aaaa"
set -g pane-border-style fg="#444444"
set -g window-status-current-style fg="#ffffff"

# set -g base-index 1
set -g renumber-windows on
set -g mouse on
set -g base-index 1

set -g status-left "#[fg=cyan]#H #[default]"
set -g status-right "#S "
set -g status-left-length 30

bind | split-window -h
bind - split-window -v



bind-key -r -T prefix       S-Up              resize-pane -U 5
bind-key -r -T prefix       S-Down            resize-pane -D 5
bind-key -r -T prefix       S-Left            resize-pane -L 5
bind-key -r -T prefix       S-Right           resize-pane -R 5


bind -n C-w previous-window
bind -n C-p next-window

bind -n M-s select-pane -L
bind -n M-t select-pane -R
bind -n M-f select-pane -U
bind -n M-r select-pane -D

bind-key -r -T prefix t  display-popup -d "#{pane_current_path}" -E "bash"
bind-key -r -T prefix g  display-popup -d "#{pane_current_path}" -w 80% -h 80% -E "lazygit"
